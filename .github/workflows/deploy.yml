name: Deploy vault to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vault

      - uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.5.2
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - run: npm ci
        working-directory: quartz

      - name: Copy vault into Quartz
        run: |
          rm -rf quartz/content && mkdir quartz/content
          rsync -a --exclude .git --exclude .github --exclude .obsidian --exclude .quartz vault/ quartz/content/
          cp vault/.quartz/quartz.config.ts quartz/
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i "s|USERNAME|$owner|" quartz/quartz.config.ts

      - run: npx quartz build
        working-directory: quartz

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
